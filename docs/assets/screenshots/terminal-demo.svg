<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <linearGradient id="term-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="term-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#313244" stop-opacity="0.4"/>
    </linearGradient>
    <style>
      .term-code {
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Menlo', 'Consolas', monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      .prompt { fill: #a6adc8; }
      .cmd-main { fill: #89b4fa; font-weight: bold; }
      .flag { fill: #cba6f7; }
      .flag-val { fill: #a6e3a1; }
      .text-cyan-bold { fill: #00f2fe; font-weight: bold; }
      .text-bold { fill: #cdd6f4; font-weight: bold; }
      .text-normal { fill: #cdd6f4; }
      .text-green { fill: #a6e3a1; font-weight: bold; }
      .text-dim { fill: #6c7086; }
      .text-blue { fill: #89b4fa; }
      .text-yellow { fill: #f9e2af; font-weight: bold; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="880" height="430" fill="#090d16"/>

  <!-- Terminal Window Shell -->
  <g transform="translate(40, 20)" filter="url(#win-shadow)">
    <!-- Window Frame -->
    <rect width="800" height="385" rx="10" fill="#131826" stroke="url(#term-border)" stroke-width="1.5"/>

    <!-- Titlebar -->
    <path d="M 0,10 C 0,4.48 4.48,0 10,0 L 790,0 C 795.52,0 800,4.48 800,10 L 800,38 L 0,38 Z" fill="url(#term-header)"/>
    <line x1="0" y1="38" x2="800" y2="38" stroke="#313244" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="22" cy="19" r="6" fill="#f38ba8"/>
    <circle cx="42" cy="19" r="6" fill="#f9e2af"/>
    <circle cx="62" cy="19" r="6" fill="#a6e3a1"/>

    <!-- Window Title -->
    <text class="term-code" x="400" y="24" text-anchor="middle" font-size="12" fill="#a6adc8">
      bash — cx -t "Fix token count logic and encoding cache"
    </text>

    <!-- Terminal Content Area -->
    <g transform="translate(28, 68)" class="term-code">
      <!-- Command prompt line 1 -->
      <text x="0" y="0">
        <tspan class="prompt">$ </tspan>
        <tspan class="cmd-main">cx </tspan>
        <tspan class="flag">-t </tspan>
        <tspan class="flag-val">"Fix token count logic and encoding cache" \</tspan>
      </text>
      <!-- Command prompt line 2 -->
      <text x="20" y="22">
        <tspan class="flag">-f </tspan>
        <tspan class="flag-val">"src/tokenizer.ts,src/packer.ts,src/ranker.ts" </tspan>
        <tspan class="flag">-b </tspan>
        <tspan fill="#fab387">2000</tspan>
      </text>

      <!-- Line 1: Header (bold cyan) -->
      <text x="0" y="58">
        <tspan class="text-cyan-bold">Context Pack</tspan>
      </text>

      <!-- Line 2: Task -->
      <text x="0" y="80">
        <tspan class="text-bold">Task: </tspan>
        <tspan class="text-normal">Fix token count logic and encoding cache</tspan>
      </text>

      <!-- Line 3: Budget -->
      <text x="0" y="102">
        <tspan class="text-bold">Budget: </tspan>
        <tspan class="text-normal">2000 tokens</tspan>
      </text>

      <!-- Line 4: Slice 1 (src/tokenizer.ts) -->
      <text x="0" y="144">
        <tspan>  </tspan>
        <tspan class="text-green">✓</tspan>
        <tspan> </tspan>
        <tspan class="text-bold">src/tokenizer.ts</tspan>
        <tspan> </tspan>
        <tspan class="text-dim">(lines 1–32)</tspan>
        <tspan>  </tspan>
        <tspan class="text-blue">244 tokens</tspan>
        <tspan>  </tspan>
        <tspan class="text-dim">score: 0.82</tspan>
      </text>

      <!-- Line 5: Slice 2 (src/packer.ts - Hotspot centered) -->
      <text x="0" y="168">
        <tspan>  </tspan>
        <tspan class="text-green">✓</tspan>
        <tspan> </tspan>
        <tspan class="text-bold">src/packer.ts</tspan>
        <tspan> </tspan>
        <tspan class="text-dim">(lines 9–108)</tspan>
        <tspan>  </tspan>
        <tspan class="text-blue">659 tokens</tspan>
        <tspan>  </tspan>
        <tspan class="text-dim">score: 0.65</tspan>
      </text>

      <!-- Line 6: Slice 3 (src/ranker.ts - Hotspot centered) -->
      <text x="0" y="192">
        <tspan>  </tspan>
        <tspan class="text-green">✓</tspan>
        <tspan> </tspan>
        <tspan class="text-bold">src/ranker.ts</tspan>
        <tspan> </tspan>
        <tspan class="text-dim">(lines 7–106)</tspan>
        <tspan>  </tspan>
        <tspan class="text-blue">756 tokens</tspan>
        <tspan>  </tspan>
        <tspan class="text-dim">score: 0.65</tspan>
      </text>

      <!-- Line 7: Summary Footer -->
      <text x="0" y="234">
        <tspan class="text-bold">Total: </tspan>
        <tspan class="text-normal">1659 / 2000 tokens  |  3 slices from 3 files  |  21.4ms</tspan>
      </text>

      <!-- Cursor -->
      <rect x="0" y="260" width="8" height="16" fill="#89b4fa" opacity="0.9"/>

    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <style>
      text {
        font-family: 'Consolas', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
        font-size: 13.5px;
      }
      .prompt { fill: #22c55e; font-weight: bold; }
      .cmd-main { fill: #38bdf8; font-weight: bold; }
      .flag { fill: #a78bfa; }
      .flag-val { fill: #f1f5f9; }
      .num { fill: #fb923c; }
      .text-cyan-bold { fill: #22d3ee; font-weight: bold; }
      .text-bold { fill: #ffffff; font-weight: bold; }
      .text-normal { fill: #e2e8f0; }
      .text-green { fill: #22c55e; font-weight: bold; }
      .text-dim { fill: #64748b; opacity: 0.85; }
      .text-blue { fill: #3b82f6; }
      .text-duration { fill: #a78bfa; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="430" fill="#090D16"/>

  <g transform="translate(30, 20)" filter="url(#win-shadow)">
    <!-- Terminal Outer Frame -->
    <rect width="820" height="390" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Titlebar -->
    <path d="M 0,12 C 0,5.37 5.37,0 12,0 L 808,0 C 814.63,0 820,5.37 820,12 L 820,38 L 0,38 Z" fill="#0f172a"/>
    <line x1="0" y1="38" x2="820" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="22" cy="19" r="6" fill="#f43f5e"/>
    <circle cx="42" cy="19" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="19" r="6" fill="#10b981"/>

    <text x="410" y="24" text-anchor="middle" font-size="12" fill="#64748b" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      bash — cx -t "Task-aware window slicing..."
    </text>

    <!-- Terminal Content Area -->
    <g transform="translate(32, 80)">
      <!-- Command Prompt line 1 -->
      <text x="0" y="0">
        <tspan class="prompt">$ </tspan>
        <tspan class="cmd-main">cx </tspan>
        <tspan class="flag">-t </tspan>
        <tspan class="flag-val">"Task-aware window slicing and greedy knapsack packing" \</tspan>
      </text>

      <!-- Command Prompt line 2 -->
      <text x="0" y="24">
        <tspan class="flag">    -f </tspan>
        <tspan class="flag-val">"src/slicer.ts,src/packer.ts" </tspan>
        <tspan class="flag">-b </tspan>
        <tspan class="num">2000</tspan>
      </text>

      <!-- Line 3: Header pc.bold(pc.cyan('Context Pack')) -->
      <text x="0" y="72">
        <tspan class="text-cyan-bold">Context Pack</tspan>
      </text>

      <!-- Line 4: Task line -->
      <text x="0" y="96">
        <tspan class="text-bold">Task: </tspan>
        <tspan class="text-normal">Task-aware window slicing and greedy knapsack packing</tspan>
      </text>

      <!-- Line 5: Budget line -->
      <text x="0" y="120">
        <tspan class="text-bold">Budget: </tspan>
        <tspan class="text-normal">2000 tokens</tspan>
      </text>

      <!-- Line 6: Slice 1 (src/slicer.ts hotspot slice) -->
      <text x="0" y="168">
        <tspan>  </tspan>
        <tspan class="text-green">✓</tspan>
        <tspan> </tspan>
        <tspan class="text-bold">src/slicer.ts</tspan>
        <tspan> </tspan>
        <tspan class="text-dim">(lines 4–103)</tspan>
        <tspan>  </tspan>
        <tspan class="text-blue">802 tokens</tspan>
        <tspan>  </tspan>
        <tspan class="text-dim">score: 0.62</tspan>
      </text>

      <!-- Line 7: Slice 2 (src/packer.ts slice) -->
      <text x="0" y="192">
        <tspan>  </tspan>
        <tspan class="text-green">✓</tspan>
        <tspan> </tspan>
        <tspan class="text-bold">src/packer.ts</tspan>
        <tspan> </tspan>
        <tspan class="text-dim">(lines 1–100)</tspan>
        <tspan>  </tspan>
        <tspan class="text-blue">716 tokens</tspan>
        <tspan>  </tspan>
        <tspan class="text-dim">score: 0.34</tspan>
      </text>

      <!-- Line 8: Summary footer -->
      <text x="0" y="240">
        <tspan class="text-bold">Total: </tspan>
        <tspan class="text-cyan-bold">1518 / 2000 tokens</tspan>
        <tspan class="text-dim">  |  </tspan>
        <tspan class="text-normal">2 slices from 2 files</tspan>
        <tspan class="text-dim">  |  </tspan>
        <tspan class="text-duration">255ms</tspan>
      </text>

      <!-- Terminal Cursor -->
      <rect x="0" y="270" width="8.1" height="18" fill="#38bdf8" opacity="0.9"/>
    </g>
  </g>
</svg>

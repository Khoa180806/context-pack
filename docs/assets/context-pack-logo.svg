<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Cyan/Blue Brand Accent Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Indigo/Violet Slice Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Emerald Target Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="3"/>

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1.5">
    <line x1="80" y1="120" x2="432" y2="120"/>
    <line x1="80" y1="190" x2="432" y2="190"/>
    <line x1="80" y1="260" x2="432" y2="260"/>
    <line x1="80" y1="330" x2="432" y2="330"/>
    <line x1="80" y1="400" x2="432" y2="400"/>
    <line x1="140" y1="80" x2="140" y2="432"/>
    <line x1="210" y1="80" x2="210" y2="432"/>
    <line x1="280" y1="80" x2="280" y2="432"/>
    <line x1="350" y1="80" x2="350" y2="432"/>
  </g>

  <!-- Outer Isometric Cube Packaging (Context Boundary) -->
  <g filter="url(#boxShadow)" transform="translate(0, 10)">
    <!-- Top Face of Container -->
    <polygon points="256,90 396,170 256,250 116,170" fill="#1E293B" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round"/>
    <!-- Left Face of Container -->
    <polygon points="116,170 256,250 256,390 116,310" fill="#0F172A" stroke="#0284C7" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right Face of Container -->
    <polygon points="256,250 396,170 396,310 256,390" fill="#090D16" stroke="#0369A1" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Layer 1: Bottom Retained Context Slice (Foundation) -->
  <g transform="translate(0, -10)">
    <polygon points="256,260 376,192 256,124 136,192" fill="url(#violetGrad)" opacity="0.85" stroke="#A5B4FC" stroke-width="2"/>
    <polygon points="136,192 256,260 256,275 136,207" fill="#4338CA"/>
    <polygon points="256,260 376,192 376,207 256,275" fill="#3730A3"/>
  </g>

  <!-- Layer 2: Middle Highlighted Code Slice (Ranked #1 Focus) -->
  <g transform="translate(0, -42)" filter="url(#softGlow)">
    <polygon points="256,240 376,172 256,104 136,172" fill="url(#cyanBlueGrad)" stroke="#BAE6FD" stroke-width="2.5"/>
    <polygon points="136,172 256,240 256,255 136,187" fill="#0369A1"/>
    <polygon points="256,240 376,172 376,187 256,255" fill="#075985"/>

    <!-- Code bracket glyph on top slice -->
    <path d="M 226,164 L 210,172 L 226,180" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 286,164 L 302,172 L 286,180" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="262" y1="160" x2="250" y2="184" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Layer 3: Precision Laser Beam / Budget Boundary Beam -->
  <g>
    <!-- Upper Precision Pointer / Token Gauge Beacon -->
    <circle cx="256" cy="68" r="8" fill="#38BDF8" filter="url(#softGlow)"/>
    <line x1="256" y1="68" x2="256" y2="120" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="6,4"/>

    <!-- Target Pinpoint Accents -->
    <circle cx="396" cy="170" r="5" fill="#34D399"/>
    <circle cx="116" cy="170" r="5" fill="#34D399"/>
    <circle cx="256" cy="250" r="6" fill="#38BDF8"/>
  </g>

  <!-- Bottom Brand Text Typography (cx / Context Pack) -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" letter-spacing="4">CONTEXT PACK</text>
  <text x="256" y="474" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="600" fill="#38BDF8" letter-spacing="3">CLI: cx | T02 STABLE</text>
</svg>
